name: S-Lang Emacs integration

on:
  push:
    paths:
      - 'editors/emacs-slang/**'
      - 'tests/test_editor_ecosystem.py'
      - '.github/workflows/editor-emacs.yml'
  pull_request:
    paths:
      - 'editors/emacs-slang/**'
      - 'tests/test_editor_ecosystem.py'
      - '.github/workflows/editor-emacs.yml'
  workflow_dispatch:

jobs:
  emacs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox

      - name: Load S-Lang major mode
        run: |
          emacs --batch -Q \
            --eval "(progn (load \"$PWD/editors/emacs-slang/slang-mode.el\") (message \"S-Lang Emacs integration loaded successfully\"))"

      - name: Verify editor integration metadata
        run: |
          python -m pytest -q tests/test_editor_ecosystem.py
