name: Build S-Lang Zed extension

on:
  push:
    paths:
      - 'editors/zed-slang/**'
      - 'editors/README.md'
      - 'tests/test_editor_ecosystem.py'
      - 'tests/test_editor_syntax_alignment_1088.py'
      - '.github/workflows/zed-extension.yml'
  pull_request:
    paths:
      - 'editors/zed-slang/**'
      - 'editors/README.md'
      - 'tests/test_editor_ecosystem.py'
      - 'tests/test_editor_syntax_alignment_1088.py'
      - '.github/workflows/zed-extension.yml'
  workflow_dispatch:

jobs:
  zed-extension:
    name: Validate Zed extension
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Validate editor ecosystem
        run: python -m pytest -q tests/test_editor_ecosystem.py

      - name: Validate Tree-sitter grammar source
        working-directory: editors/zed-slang/tree-sitter-slang
        run: |
          node --check grammar.js
          npm install --global tree-sitter-cli
          tree-sitter generate

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Check Zed extension
        working-directory: editors/zed-slang
        run: cargo check
